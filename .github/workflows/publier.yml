name: Publier sur quipaie2027.fr

# Publication automatique : chaque relève poussée sur `veille` part en ligne dès
# qu'elle passe les contrôles ci-dessous, sans intervention humaine. Une relève qui
# échoue à un contrôle ne publie rien et le site garde la version précédente.
# Après publication, `master` est avancé sur `veille` : il reste le reflet de ce qui
# est en ligne.
on:
  push:
    branches: [master, veille]
    paths:
      - 'template.html'
      - 'build.py'
      - 'dataset/simulateur/**'
      - '.github/workflows/publier.yml'
  workflow_dispatch:

# Les publications se suivent sans s'interrompre : couper un envoi FTP en cours
# laisserait une page tronquée en ligne.
concurrency:
  group: publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # On reconstruit plutôt que de faire confiance au fichier versionné : si la page
      # committée ne correspond plus à ses données, mieux vaut le savoir ici que le
      # publier. --force parce que le CI part d'une copie neuve, sans empreinte locale.
      - name: Reconstruire la page
        run: python3 build.py --force

      - name: Refuser une page périmée
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html versionné ne correspond pas à ses données."
            echo "Reconstruire en local (python3 build.py) et committer le résultat."
            git diff --stat -- index.html
            exit 1
          fi
          echo "index.html est en phase avec ses données."

      - name: Contrôler la page
        run: python3 .claude/skills/france-budget-watch/scripts/watch.py controler

      - name: Envoyer sur l'hébergement
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_TLS_NAME: ${{ vars.FTP_TLS_NAME }}
        run: |
          : "${FTP_HOST:?secret FTP_HOST manquant}"
          : "${FTP_USER:?secret FTP_USER manquant}"
          : "${FTP_PASS:?secret FTP_PASS manquant}"
          # Hostinger présente un certificat *.hstgr.io, qui ne couvre ni l'IP ni
          # ftp.<domaine>. FTP_TLS_NAME (ex. ftp.hstgr.io) fait vérifier le certificat
          # sous ce nom tout en se connectant à l'IP de FTP_HOST.
          cible="$FTP_HOST"; resolve=()
          if [ -n "$FTP_TLS_NAME" ]; then
            resolve=(--resolve "$FTP_TLS_NAME:21:$FTP_HOST"); cible="$FTP_TLS_NAME"
          fi
          # --ssl-reqd : on refuse d'envoyer le mot de passe si le serveur ne propose pas TLS.
          ftp() { curl --fail --silent --show-error --ssl-reqd "${resolve[@]}" \
                       --user "$FTP_USER:$FTP_PASS" "$@"; }
          # Selon le compte FTP, Hostinger ouvre la session à la racine du plan, du site
          # ou directement dans public_html. On prend le premier dossier qui existe ;
          # l'étape suivante vérifie que c'est bien celui que sert le site.
          dossier=""
          for d in "${FTP_DIR:-public_html}" public_html domains/quipaie2027.fr/public_html .; do
            if ftp --list-only "ftp://$cible/$d/" -o liste.txt 2>/dev/null; then
              if [ "$d" != "." ] || grep -qx 'index.html' liste.txt; then dossier="$d"; break; fi
            fi
          done
          [ -n "$dossier" ] || { echo "::error::aucun dossier web trouvé sur le FTP"; cat liste.txt 2>/dev/null; exit 1; }
          echo "Dossier web : $dossier"
          ftp --upload-file index.html "ftp://$cible/$dossier/index.html"
          echo "En ligne : https://quipaie2027.fr"

      # Une page vide ou tronquée répondrait quand même 200 : on vérifie que la page
      # servie se termine comme la page envoyée.
      - name: Vérifier la page en ligne
        run: |
          sleep 5
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' \
               "https://quipaie2027.fr/?v=${GITHUB_SHA}" -o servi.html
          echo "envoyé : $(wc -c < index.html) octets — servi : $(wc -c < servi.html) octets"
          if [ "$(tail -c 300 servi.html)" != "$(tail -c 300 index.html)" ]; then
            echo "::error::la page servie ne se termine pas comme la page envoyée (tronquée, ou cache)"
            exit 1
          fi

      # `master` suit ce qui est en ligne. Fast-forward strict : si les branches ont
      # divergé, on le signale sans rien forcer (le site, lui, est déjà à jour).
      - name: Avancer master sur la relève publiée
        if: github.ref == 'refs/heads/veille'
        run: |
          git fetch origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            git push origin HEAD:master
          else
            echo "::warning::master a divergé de veille : non avancé, à regarder."
          fi
